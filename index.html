<script>
/* ============================ UTILIDADES ============================ */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
const BASE = location.origin + location.pathname;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', 2800);
}
function money(n, cur){
  if (n === null || n === undefined || n === '') return '';
  return new Intl.NumberFormat('es-MX', {style:'currency', currency: cur || 'MXN', maximumFractionDigits: Number(n) % 1 ? 2 : 0}).format(n);
}
function fechaLarga(iso){
  if (!iso) return '';
  const d = new Date(iso);
  const s = d.toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const h = d.toLocaleTimeString('es-MX', {hour:'numeric', minute:'2-digit'});
  return s.charAt(0).toUpperCase() + s.slice(1) + ' · ' + h;
}
function fechaCorta(iso){ return new Date(iso).toLocaleDateString('es-MX', {weekday:'short', day:'numeric', month:'short'}); }
function hora(iso){ const d = new Date(iso); return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'}); }
function toLocalInput(iso){
  if (!iso) return '';
  const d = new Date(iso); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function waPhone(t){
  const d = String(t || '').replace(/\D/g,'');
  if (!d) return '';
  if (d.length === 10) return '52' + d;
  return d;
}
function waLink(tel, text){ return 'https://wa.me/' + (waPhone(tel) || '') + '?text=' + encodeURIComponent(text); }
async function copiar(text){
  try{ await navigator.clipboard.writeText(text); toast('Copiado ✅'); return; }catch(e){}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Copiado ✅'); }catch(e){ toast('No se pudo copiar', true); }
  ta.remove();
}
function modal(html){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal"><div class="card ribbon">${html}</div></div>`;
  root.querySelector('.modal').addEventListener('click', e => { if (e.target.classList.contains('modal')) closeModal(); });
  return root;
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
function confirmar(titulo, texto, btn = 'Sí, continuar', clase = 'rojo'){
  return new Promise(res => {
    const r = modal(`<h2>${titulo}</h2><p class="muted">${texto}</p>
      <div class="row mt"><button class="btn ghost grow" data-x="no">Cancelar</button><button class="btn ${clase} grow" data-x="si">${btn}</button></div>`);
    r.querySelector('[data-x=no]').onclick = () => { closeModal(); res(false); };

function conservar(fn){
  const vals = {}; let foco = null, sel = null;
  app.querySelectorAll('input[id],textarea[id],select[id]').forEach(el => { if (el.type !== 'file' && el.type !== 'checkbox' && el.dataset.keep !== 'no') vals[el.id] = el.value; });

/* Reduce una foto a ~600px en JPEG para guardarla ligera */
function reducirFoto(file){
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Elige una imagen'));
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let q = .78, max = 600, out;
        for (let i = 0; i < 5; i++){
          const s = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', q);
          if (out.length < 200000) break;
          q -= .12; max -= 100;
        }
        out.length < 240000 ? res(out) : rej(new Error('La foto es muy pesada'));
      };
      img.onerror = () => rej(new Error('No se pudo leer la imagen'));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function confeti(n = 160){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confeti'), x = c.getContext('2d');
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; x.scale(devicePixelRatio, devicePixelRatio);
  const cols = document.body.classList.contains('trabajo') ? ['#e8cf8a','#c9a54e','#ffffff','#9cc2f5','#2f5288'] : ['#d4343b','#f3d27a','#2a7a4d','#ffffff','#d9a93a'];
  const ps = Array.from({length:n}, () => ({x: innerWidth/2 + (Math.random()-.5)*innerWidth*.4, y: innerHeight*.35, vx:(Math.random()-.5)*14, vy: -Math.random()*14-4,
    w: 6+Math.random()*7, h: 8+Math.random()*10, r: Math.random()*6, vr:(Math.random()-.5)*.3, c: cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function paso(t){
    x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w/2, -p.h/2, p.w, p.h*Math.abs(Math.cos(p.r*2))); x.restore(); });
    if (t - t0 < 4200) requestAnimationFrame(paso); else x.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

/* ============================ MÚSICA (villancicos de dominio público, sintetizados) ============================ */
const Musica = {
  ctx: null, master: null, on: false, timer: null, t: 0, i: 0, cancion: 0,
  N: (() => { const m = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}; return s => { const n = m[s[0]] + (s[1]==='#'?1:0); const o = +s[s.length-1]; return 440*Math.pow(2, (n + (o-4)*12 - 9)/12); }; })(),
  canciones: [
    // Jingle Bells (James Lord Pierpont, 1857)
    {tempo:.28, notas:'E4:1 E4:1 E4:2 E4:1 E4:1 E4:2 E4:1 G4:1 C4:1.5 D4:.5 E4:4 F4:1 F4:1 F4:1.5 F4:.5 F4:1 E4:1 E4:1 E4:.5 E4:.5 E4:1 D4:1 D4:1 E4:1 D4:2 G4:2 E4:1 E4:1 E4:2 E4:1 E4:1 E4:2 E4:1 G4:1 C4:1.5 D4:.5 E4:4 F4:1 F4:1 F4:1.5 F4:.5 F4:1 E4:1 E4:1 E4:.5 E4:.5 G4:1 G4:1 F4:1 D4:1 C4:4 -:2'},
    // Noche de Paz (Franz Gruber, 1818)
    {tempo:.24, notas:'G4:3 A4:1 G4:2 E4:6 G4:3 A4:1 G4:2 E4:6 D5:4 D5:2 B4:6 C5:4 C5:2 G4:6 A4:4 A4:2 C5:3 B4:1 A4:2 G4:3 A4:1 G4:2 E4:6 A4:4 A4:2 C5:3 B4:1 A4:2 G4:3 A4:1 G4:2 E4:6 D5:4 D5:2 F5:3 D5:1 B4:2 C5:6 E5:6 C5:3 G4:1 E4:2 G4:3 F4:1 D4:2 C4:12 -:4'}
  ],
  iniciar(){
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .13; this.master.connect(this.ctx.destination);
    return true;
  },
  campana(freq, t, dur, vol = 1){
    const c = this.ctx, g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(0.0008, t + Math.max(.45, dur*1.1));
    g.connect(this.master);
    [[1,'sine',1],[2,'sine',.35],[3,'triangle',.12]].forEach(([m, tipo, v]) => {
      const o = c.createOscillator(), og = c.createGain(); o.type = tipo; o.frequency.value = freq*m; og.gain.value = v;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + Math.max(.5, dur*1.2));
    });
  },
  programar(){
    const c = this.ctx;
    while (this.t < c.currentTime + .6){
      const song = this.canciones[this.cancion], notas = song.notas.split(' ');
      if (this.i >= notas.length){ this.i = 0; this.cancion = (this.cancion + 1) % this.canciones.length; continue; }
      const [n, b] = notas[this.i].split(':'); const dur = +b * song.tempo;
      if (n !== '-'){ this.campana(this.N(n), this.t, dur); if (this.i % 4 === 0) this.campana(this.N(n)/2, this.t, dur, .35); }
      this.t += dur; this.i++;
    }
  },
  alternar(){
    if (!this.iniciar()) return toast('Tu navegador no permite música', true);
    this.on = !this.on;
    if (this.on){ this.ctx.resume(); this.t = this.ctx.currentTime + .1; this.programar(); this.timer = setInterval(() => this.programar(), 150); }
    else clearInterval(this.timer);
    this.pintar();
  },
  pintar(){ const f = $('#fab'); f.classList.toggle('on', this.on); f.textContent = this.on ? '🔊' : '🎵'; },
  efecto(tipo){
    if (!this.iniciar()) return; const c = this.ctx; c.resume(); const t = c.currentTime;
    if (tipo === 'redoble'){
      const len = 2.2, buf = c.createBuffer(1, c.sampleRate*len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++){ const s = i / c.sampleRate; d[i] = (Math.random()*2-1) * (.35 + .65*Math.abs(Math.sin(s*Math.PI*22))) * (s/len*.8 + .2); }
      const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); f.type = 'bandpass'; f.frequency.value = 900; g.gain.value = 1.4;
      src.buffer = buf; src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
    } else {
      ['C5','E5','G5','C6'].forEach((n, k) => this.campana(this.N(n), t + k*.09, .9, .9));
    }
  }
};

function ideasPara(perfil, monto, max = 6){
  const p = perfil || {};
  const txt = norm([p.gustos, p.colores].join(' '));
  const evitar = norm(p.evitar);
  const maxP = monto ? monto * 1.1 : 600, minP = monto ? monto * .35 : 0;
  const lista = IDEAS.filter(([e, t, pr, k]) => pr <= maxP && pr >= minP && !(evitar && (norm(t).split(/\s+/).some(w => w.length > 3 && evitar.includes(w)) || k.split(' ').some(w => w && evitar.includes(w)))))
    .map(i => ({i, s: i[3].split(' ').filter(w => w && txt.includes(w)).length + Math.random()*.5}))
    .sort((a, b) => b.s - a.s).slice(0, max).map(x => x.i);
  return lista;
}

/* ============================ SUPABASE ============================ */
const configurado = !SUPABASE_URL.includes('PEGA_') && !SUPABASE_KEY.includes('PEGA_');
async function rpc(fn, args = {}){
  const headers = {'Content-Type':'application/json', 'apikey': SUPABASE_KEY};
  if (SUPABASE_KEY.startsWith('eyJ')) headers['Authorization'] = 'Bearer ' + SUPABASE_KEY;
  let r;
  try{
    r = await fetch(SUPABASE_URL.replace(/\/$/,'') + '/rest/v1/rpc/' + fn, {method:'POST', headers, body: JSON.stringify(args)});
  }catch(e){ throw new Error('Sin conexión. Revisa tu internet.'); }
  const txt = await r.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if (!r.ok){
    const m = (data && data.message) || '';
    if (/Could not find the function|schema cache/i.test(m)) throw new Error('Falta actualizar la base de datos: corre intercambio.sql en Supabase');
    throw new Error(m || 'Error del servidor (' + r.status + ')');
  }
  return data;
}
async function hacer(btn, fn){
  if (btn){ btn.disabled = true; }
  try{ return await fn(); }
  catch(e){ toast(e.message, true); throw e; }
  finally{ if (btn) btn.disabled = false; }
}

  enlazar(){

    }));
    const mt = $('#mej_txt'); if (mt) mt.onkeydown = e => { if (e.key === 'Enter') $('#mejAdd').click(); };
    app.querySelectorAll('[data-mej]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_mejora_estado', {p_admin: this.code, p_id: b.dataset.mej, p_hecho: b.dataset.v === '1'}); await this.cargar();

    app.querySelectorAll('[data-mejq]').forEach(b => b.onclick = () => hacer(b, async () => {

/* ============================ PANTALLA DE TV ============================ */
const TV = {
  d: null, i: -1, fase: 'inicio',
  async iniciar(code){
    sinNav(); $('#fab').style.display = 'none';
    try{ this.d = await rpc('ix_tv', {p_admin: code}); }
    catch(e){
      app.innerHTML = `<div class="hero"><div class="emoji">📺</div><h1>Pantalla de TV</h1><p>${esc(e.message)}</p></div><div class="center"><a class="btn oro" href="?admin=${esc(code)}">Ir al panel</a></div>`;
      return;
    }
    aplicarTema(this.d.tema);
    document.addEventListener('keydown', e => { if ([' ', 'Enter', 'ArrowRight', 'PageDown'].includes(e.key)){ e.preventDefault(); this.avanzar(); } });
    this.render();
  },
  avanzar(){
    if (this.fase === 'inicio'){ if (!Musica.on) Musica.alternar(); this.i = 0; this.fase = 'pregunta'; }
    else if (this.fase === 'pregunta'){ this.fase = 'redoble'; this.render(); if (Musica.on){ Musica.alternar(); this._musica = true; } Musica.efecto('redoble');
      setTimeout(() => { this.fase = 'revelado'; this.render(); confeti(220); Musica.efecto('campanas'); }, 2300); return; }
    else if (this.fase === 'revelado'){ this.i++; this.fase = this.i >= this.d.pares.length ? 'fin' : 'pregunta'; if (this._musica && !Musica.on){ Musica.alternar(); } if (this.fase === 'fin') confeti(260); }
    else if (this.fase === 'fin'){ this.fase = 'inicio'; this.i = -1; }
    else return;
    this.render();
  },
  render(){
    const p = this.d.pares[this.i] || {}, total = this.d.pares.length;
    const prog = this.i >= 0 && this.i < total ? `<div class="prog">${this.i + 1} de ${total}</div>` : '';
    let h = '';
    if (this.fase === 'inicio') h = `<img src="icon-512.png" alt="" style="width:min(22vh,200px);border-radius:24%;box-shadow:0 20px 50px rgba(0,0,0,.5)">
      <div class="t2">${esc(this.d.nombre)}</div><div class="t1">Revelación de Santas · ${total} participantes</div>
      <div class="ctrl"><button class="btn oro" id="go">▶ Comenzar</button></div>`;
    else if (this.fase === 'pregunta') h = `<div class="t1">¿Quién le regaló a…</div><div class="t2">${esc(p.para)}?</div>
      <div class="ctrl"><button class="btn rojo" id="go">🥁 Revelar</button></div>`;
    else if (this.fase === 'redoble') h = `<div class="t1">El Santa de ${esc(p.para)} es…</div><div class="redoble">🥁</div>`;
    else if (this.fase === 'revelado') h = `<div class="t1">El Santa de <b>${esc(p.para)}</b> fue</div><div class="t3">${esc(p.de)}</div>
      <div class="ctrl"><button class="btn oro" id="go">${this.i + 1 < total ? 'Siguiente ›' : 'Terminar 🎉'}</button></div>`;
    else h = `<div style="font-size:min(16vh,140px)">🎄</div><div class="t2 oro">¡Feliz Navidad!</div><div class="t1">Gracias por participar en ${esc(this.d.nombre)}</div>
      <div class="ctrl"><button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="go">↺ Volver a empezar</button></div>`;
    app.innerHTML = `<div class="tv">${prog}${h}</div>`;
    const go = $('#go'); if (go) go.onclick = () => this.avanzar();
  }
};

const Part = {
  token: null, pin: null, d: null, tab: 'amigo', chatCon: 'santa', timer: null, foto: null, prio: 2,
  iniciar(token){
    this.token = token;
    const guardado = store.get('ix_pin_' + token, null);
    if (guardado){ this.pin = guardado; this.entrar(true); }
    else this.pantallaPin();
  },
  pantallaPin(error){
    sinNav();
    app.innerHTML = `
      <div class="hero"><img class="logo" src="icon-512.png" alt=""><h1>¡Hola! Escribe tu <em>código</em></h1>
      <p>Son los 4 dígitos que te llegaron por WhatsApp</p></div>
      <div class="card ribbon center">
        <div class="pinbox">${[0,1,2,3].map(i => `<input inputmode="numeric" maxlength="1" pattern="[0-9]*" data-i="${i}" aria-label="Dígito ${i+1}">`).join('')}</div>
        ${error ? `<p style="color:#b3202a;font-weight:800">${esc(error)}</p>` : ''}
        <button class="btn rojo full" id="entrar">Entrar 🎁</button>
      </div>${pie()}`;
    const ins = [...app.querySelectorAll('.pinbox input')];
    ins.forEach((inp, i) => {
      inp.oninput = () => {
        inp.value = inp.value.replace(/\D/g,'').slice(-1);
        if (inp.value && i < 3) ins[i+1].focus();
        if (ins.every(x => x.value)) $('#entrar').click();
      };
      inp.onkeydown = e => { if (e.key === 'Backspace' && !inp.value && i > 0) ins[i-1].focus(); };
      inp.onpaste = e => {
        const t = (e.clipboardData.getData('text') || '').replace(/\D/g,'').slice(0,4);
        if (t.length){ e.preventDefault(); t.split('').forEach((c, j) => ins[j] && (ins[j].value = c)); if (t.length === 4) $('#entrar').click(); }
      };
    });
    ins[0].focus();
    $('#entrar').onclick = () => {
      const pin = ins.map(x => x.value).join('');
      if (pin.length < 4) return toast('Escribe los 4 dígitos', true);
      this.pin = pin; this.entrar();
    };
  },
  async entrar(auto){
    try{
      this.d = await rpc('ix_entrar', {p_token: this.token, p_pin: this.pin});
      store.set('ix_pin_' + this.token, this.pin);
      aplicarTema(this.d.grupo.tema);
      if (!this._listo){
        this._listo = true;
        if (!this.d.grupo.sorteado) this.tab = 'lista';
        window.addEventListener('focus', () => this.refrescar());
      }
      this.render();
    }catch(e){
      if (/código/i.test(e.message)){ store.del('ix_pin_' + this.token); this.pantallaPin(auto ? null : 'Código incorrecto, revisa tu WhatsApp'); }
      else if (/link/i.test(e.message)){ sinNav(); app.innerHTML = `<div class="hero"><div class="emoji">😕</div><h1>Link no válido</h1><p>${esc(e.message)}</p></div>`; }
      else { this.pantallaPin(e.message); }
    }
  },
  async refrescar(){
    if (!this.d) return;
    try{ this.d = await rpc('ix_entrar', {p_token: this.token, p_pin: this.pin}); this.render(true); }catch(e){}
  },
  nav(){
    const n = $('#nav'); n.hidden = false; document.body.classList.remove('sin-nav');
    const visto = store.get('ix_chatvisto_' + this.token, 0);
    const recibidos = [...this.d.chat_santa.filter(m => m.autor === 'santa'), ...this.d.chat_amigo.filter(m => m.autor === 'amigo')];
    const nuevos = recibidos.some(m => new Date(m.fecha).getTime() > visto);
    const tabs = [['amigo','🎁','Mi amigo'],['lista','📝','Mi lista'],['chat','💬','Mensajes'],['evento','📅','Evento']];
    n.innerHTML = `<div class="in">${tabs.map(([k, i, t]) => `<button class="${this.tab === k ? 'on' : ''}" data-tab="${k}"><span class="i">${i}</span>${t}${k === 'chat' && nuevos && this.tab !== 'chat' ? '<span class="dot"></span>' : ''}</button>`).join('')}</div>`;

  },

    const y = window.scrollY;

  vChat(){
    const g = this.d.grupo;
    if (!g.sorteado) return `<div class="card ribbon center"><div style="font-size:50px">💬</div><h2 style="justify-content:center">Mensajes anónimos</h2>
      <p class="muted">Cuando se haga el sorteo podrás preguntarle cosas a tu amigo secreto sin que sepa quién eres, contestarle a tu Santa y ver sus pistas.</p></div>`;
    const con = this.chatCon;
    const lista = con === 'santa' ? this.d.chat_santa : this.d.chat_amigo;
    const yoAutor = con === 'santa' ? 'amigo' : 'santa';
    const quien = con === 'santa' ? 'Tu Santa (anónimo)' : this.d.amigo.nombre;
    const ps = this.d.pistas_santa || [];
    return `
      <div class="seg"><button class="${con === 'santa' ? 'on' : ''}" data-con="santa">🎅 Mi Santa</button><button class="${con === 'amigo' ? 'on' : ''}" data-con="amigo">🎁 ${esc(this.d.amigo.nombre)}</button></div>
      ${con === 'santa' ? `<div class="card"><h2>🔍 Pistas de tu Santa</h2>
        ${ps.length ? ps.map(p => p.texto ? `<div class="pista"><span class="n">${p.n}</span><span>${esc(p.texto)}</span></div>`
            : `<div class="pista lock"><span class="n">🔒</span><span class="muted">La pista ${p.n} se desbloquea el <b>${esc(fechaCorta(p.desbloquea))}</b></span></div>`).join('')
          : '<div class="muted small">Tu Santa aún no deja pistas. ¡Pídeselas! 👇</div>'}
      </div>` : ''}
      <div class="card ribbon">
        <p class="muted mt0 small">${con === 'santa'
          ? 'Aquí te escribe quien te va a regalar. Tú no sabes quién es 🤫'
          : `Pregúntale a <b>${esc(this.d.amigo.nombre)}</b> lo que quieras. <b>No sabrá que eres tú.</b>`}</p>
        <div class="chat" id="chat">
          ${lista.length ? lista.map(m => `<div class="msg ${m.autor === yoAutor ? 'me' : 'them'}">${esc(m.texto)}<time>${m.autor === yoAutor ? 'Tú' : esc(quien)} · ${esc(hora(m.fecha))}</time></div>`).join('')
            : `<div class="empty small">${con === 'santa' ? 'Tu Santa aún no te escribe.' : 'Ej. “¿Prefieres algo para la casa o para ti?”'}</div>`}
        </div>
        <div class="row mt"><input id="m_txt" class="grow" maxlength="400" placeholder="${con === 'santa' ? 'Escríbele a tu Santa…' : 'Pregunta anónima…'}"><button class="btn rojo" id="m_send">Enviar</button></div>
      </div>`;
  },
  vEvento(){
    const g = this.d.grupo, cena = this.d.cena || [], yo = this.d.yo.id;
    return `
      ${g.revelado && this.d.santa_nombre ? `<div class="banner center"><div style="font-size:40px">🎅</div><b>¡Tu Santa fue ${esc(this.d.santa_nombre)}!</b></div>` : ''}
      <div class="card ribbon">
        <h2>📅 El intercambio</h2>
        <div class="info">
          ${g.monto ? `<span class="k">💰</span><span><b>${money(g.monto, g.moneda)}</b> por regalo</span>` : ''}
          ${g.fecha ? `<span class="k">📅</span><span>${esc(fechaLarga(g.fecha))}</span>` : '<span class="k">📅</span><span class="muted">Fecha por definir</span>'}
          ${g.lugar ? `<span class="k">📍</span><span>${esc(g.lugar)}</span>` : ''}
          <span class="k">${g.tema === 'trabajo' ? '👥' : '👨‍👩‍👧‍👦'}</span><span>${g.total} participantes</span>
          ${g.notas ? `<span class="k">📝</span><span>${esc(g.notas)}</span>` : ''}
        </div>
        ${countdownHTML(g.fecha)}
      </div>
      <div class="card"><h2>🍽️ ¿Quién lleva qué?</h2>
        ${cena.length ? cena.map(c => `<div class="row" style="padding:9px 0;border-bottom:1px dashed var(--linea)">
            <span class="grow"><b>${esc(c.texto)}</b><br>${c.quien_id === yo ? '<span class="chip ok">Lo llevas tú ✓</span>' : c.quien ? `<span class="chip">${esc(c.quien)}</span>` : '<span class="chip rojo">Falta quién</span>'}</span>
            ${c.quien_id === yo ? `<button class="btn xs ghost" data-cena="${esc(c.id)}" data-v="0">Soltar</button>` : c.quien ? '' : `<button class="btn xs verde" data-cena="${esc(c.id)}" data-v="1">Yo lo llevo</button>`}
          </div>`).join('') : '<div class="muted small">El organizador aún no anota platillos. Puedes proponer uno.</div>'}
        <div class="row mt"><input id="cena_txt" class="grow" maxlength="80" placeholder="Yo llevo… (ej. postre)"><button class="btn verde" id="cenaAdd">+</button></div>
      </div>
      <div class="card"><h2>🤫 Reglas</h2>
        <ul class="muted" style="padding-left:18px;margin:0">
          <li>No le digas a nadie a quién te tocó.</li>
          ${g.monto ? `<li>Respeta el monto de ${money(g.monto, g.moneda)}.</li>` : ''}
          <li>Usa los mensajes anónimos si tienes dudas.</li>
          <li>Guarda tu link de WhatsApp para volver a entrar.</li>
        </ul>
        <div class="row wrapr mt"><a class="btn ghost sm" href="?ayuda">📖 ¿Cómo funciona?</a><button class="btn ghost sm" id="salir">Cerrar sesión en este celular</button></div>
      </div>`;
  },
  enlazar(){
    const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
    const base = () => ({p_token: this.token, p_pin: this.pin});
    app.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { this.tab = b.dataset.ir; if (b.dataset.con) this.chatCon = b.dataset.con; this.render(); window.scrollTo(0,0); });
    app.querySelectorAll('.seg [data-con]').forEach(b => b.onclick = () => { this.chatCon = b.dataset.con; this.render(); });
    app.querySelectorAll('img[data-foto]').forEach(i => i.onclick = () => verFoto(i.src));
    on('#gift', e => {
      const gft = e.currentTarget; gft.classList.add('shake'); Musica.efecto('redoble');
      setTimeout(() => { gft.classList.remove('shake'); gft.classList.add('open'); }, 1000);
      setTimeout(() => { store.set('ix_rev_' + this.token, true); this.render(); confeti(); Musica.efecto('campanas'); }, 1600);
    });
    app.querySelectorAll('[data-comprar]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_deseo_comprado', Object.assign(base(), {p_id: b.dataset.comprar, p_comprado: b.dataset.v === '1'}));
      await this.refrescar();
    }));
    app.querySelectorAll('[data-prio]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_deseo_prioridad', Object.assign(base(), {p_id: b.dataset.prio, p_prioridad: +b.dataset.v}));
      await this.refrescar();
    }));
    const fi = $('#d_foto'); if (fi) fi.onchange = async () => {
      try{ this.foto = await reducirFoto(fi.files[0]); this.render(true); }catch(e){ toast(e.message, true); }
    };
    on('#d_fotoq', () => { this.foto = null; this.render(true); });
    on('#d_prio', () => { this.prio = this.prio === 1 ? 2 : 1; this.render(true); });
    on('#d_add', e => hacer(e.currentTarget, async () => {
      const t = $('#d_txt').value.trim(); if (!t) throw new Error('Escribe qué te gustaría');
      let link = $('#d_link').value.trim(); if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
      const pr = $('#d_precio').value;
      await rpc('ix_deseo_agregar', Object.assign(base(), {p_texto: t, p_link: link || null, p_precio: pr === '' ? null : Number(pr), p_foto: this.foto, p_prioridad: this.prio}));
      this.foto = null; this.prio = 2;
      ['d_txt','d_link','d_precio'].forEach(id => { const el = $('#' + id); el.value = ''; el.dataset.keep = 'no'; });
      toast('¡Agregado a tu lista! 🎁'); await this.refrescar(); const n = $('#d_txt'); if (n) n.focus();
    }));
    const dt = $('#d_txt'); if (dt) dt.onkeydown = e => { if (e.key === 'Enter') $('#d_add').click(); };
    app.querySelectorAll('[data-idea]').forEach(b => b.onclick = () => hacer(b, async () => {
      const [e, t, pr] = (this.ideasLista || [])[+b.dataset.idea] || [];
      if (!t) return;
      await rpc('ix_deseo_agregar', Object.assign(base(), {p_texto: t, p_link: null, p_precio: pr, p_foto: null, p_prioridad: 2}));
      toast('¡Agregado! ' + e); await this.refrescar();
    }));
    app.querySelectorAll('[data-borrard]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_deseo_quitar', Object.assign(base(), {p_id: b.dataset.borrard})); await this.refrescar();
    }));
    on('#pf_save', e => hacer(e.currentTarget, async () => {
      const pf = {}; ['talla','calzado','colores','gustos','evitar'].forEach(k => pf[k] = $('#pf_' + k).value.trim());
      await rpc('ix_perfil', Object.assign(base(), {p_perfil: pf})); toast('Datos guardados ✅'); await this.refrescar();
    }));
    on('#pistasSave', e => hacer(e.currentTarget, async () => {
      for (const n of [1,2,3]){
        const nuevo = $('#pista' + n).value.trim(), viejo = ((this.d.pistas_mias || []).find(x => x.n === n) || {}).texto || '';
        if (nuevo !== viejo) await rpc('ix_pista_guardar', Object.assign(base(), {p_n: n, p_texto: nuevo}));
      }
      toast('Pistas guardadas 🕵️'); await this.refrescar();
    }));
    const send = btn => hacer(btn, async () => {
      const t = $('#m_txt').value.trim(); if (!t) return;
      await rpc('ix_mensaje', Object.assign(base(), {p_hacia: this.chatCon, p_texto: t}));
      $('#m_txt').value = ''; $('#m_txt').dataset.keep = 'no';
      await this.refrescar(); const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight;
    });
    on('#m_send', e => send(e.currentTarget));
    const mt = $('#m_txt'); if (mt) mt.onkeydown = e => { if (e.key === 'Enter') send($('#m_send')); };
    const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight;
    app.querySelectorAll('[data-cena]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_cena_tomar', Object.assign(base(), {p_id: b.dataset.cena, p_tomar: b.dataset.v === '1'}));
      toast(b.dataset.v === '1' ? '¡Apartado! 🍽️' : 'Listo, lo soltaste'); await this.refrescar();
    }));
    on('#cenaAdd', e => hacer(e.currentTarget, async () => {
      const t = $('#cena_txt').value.trim(); if (!t) throw new Error('Escribe qué vas a llevar');
      await rpc('ix_cena_agregar', Object.assign(base(), {p_texto: t}));
      $('#cena_txt').value = ''; $('#cena_txt').dataset.keep = 'no'; toast('¡Anotado! 🍽️'); await this.refrescar();
    }));
    on('#salir', () => { store.del('ix_pin_' + this.token); location.reload(); });
  }
};

arrancar();
</script>
</body>
</html>
