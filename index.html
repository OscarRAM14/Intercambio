.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--oro2);flex:none}
.avatar.lg{width:88px;height:88px;border-width:3px;display:block;margin:6px auto}
.avatar.sm{width:26px;height:26px;border-width:1.5px}
.barra{height:10px;background:var(--papel);border-radius:99px;overflow:hidden;margin:6px 0}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--oro),var(--ok));border-radius:99px}
.chispa{position:fixed;pointer-events:none;z-index:45;font-size:16px;color:#fff;text-shadow:0 0 6px rgba(255,255,255,.8)}
.grab{font-size:44px;text-align:center;animation:latido 1s infinite}
.efectos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}

*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Nunito,system-ui,sans-serif; color:var(--tinta); min-height:100vh;
  background:
    radial-gradient(1200px 600px at 50% -200px, var(--glow) 0%, transparent 70%),
    radial-gradient(circle at 20% 80%, rgba(217,169,58,.06) 0 2px, transparent 3px) 0 0/38px 38px,
    var(--noche);
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
button,input,textarea,select{font:inherit}
a{color:var(--rojo)}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 24px;position:relative;z-index:1}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#snow span{position:absolute;top:-10px;color:#fff;opacity:.7;animation:caer linear infinite}
@keyframes caer{to{transform:translateY(110vh) translateX(30px)}}
@media (prefers-reduced-motion:reduce){#snow{display:none}}

.hero{text-align:center;color:var(--crema);padding:18px 0 8px}
body.trabajo .hero{color:#fff}
.hero .emoji{font-size:54px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.hero .logo{width:112px;height:112px;border-radius:26px;box-shadow:0 14px 30px rgba(0,0,0,.45);display:block;margin:0 auto 10px}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--oro2)}
.hero p{color:var(--sub);margin:6px 0 0}
.top{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:12px}
.top h1{font-size:22px;flex:1}
.top .sub{font-size:13px;color:var(--sub)}
.iconbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;text-decoration:none;
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;font-size:18px;flex:none}

.card{background:var(--crema);border-radius:20px;padding:18px;margin:14px 0;box-shadow:var(--sombra);position:relative}
.card.ribbon{border-top:6px solid var(--rojo)}
body.trabajo .card.ribbon{border-top-color:var(--oro)}
.card h2{font-size:20px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3{font-size:16px;margin:16px 0 8px}
.muted{color:var(--gris);font-size:14px}
.small{font-size:13px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mt{margin-top:12px}.mt0{margin-top:0}
hr.sep{border:0;border-top:1px dashed var(--linea);margin:16px 0}

label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input,textarea,select{width:100%;border:2px solid var(--linea);background:#fff;border-radius:12px;padding:11px 12px;color:var(--tinta);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--oro)}
textarea{resize:vertical;min-height:70px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--rojo);flex:none}
.check{display:flex;gap:10px;align-items:center;font-weight:600;margin:10px 0}
.hint{font-size:12px;color:var(--gris);margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;
  font-weight:800;cursor:pointer;text-decoration:none;transition:transform .08s, filter .15s;font-size:15px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.full{width:100%}
.btn.rojo{background:linear-gradient(180deg,var(--rojoA),var(--rojo2));color:#fff;box-shadow:0 4px 0 var(--rojoS)}
.btn.verde{background:linear-gradient(180deg,#2a7a4d,#1e5b3a);color:#fff;box-shadow:0 4px 0 #0f3b23}
.btn.oro{background:linear-gradient(180deg,var(--oro2),var(--oro));color:#3b2a06;box-shadow:0 4px 0 #a07a1f}
.btn.wa{background:#25d366;color:#053d1c;box-shadow:0 4px 0 #128c4a}
.btn.ghost{background:transparent;border:2px solid var(--linea);color:var(--tinta)}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:11px}
.btn.xs{padding:6px 9px;font-size:12px;border-radius:9px;box-shadow:none}
.btn.danger{background:#fff;color:#b3202a;border:2px solid #f0c5c7}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:#efe6d6;color:#6b5c4c;display:inline-block}
body.trabajo .chip{background:#e8ecf3;color:#4a5568}
.chip.ok{background:#dcf1e3;color:#1e6b3b}
.chip.oro{background:#fbecc4;color:#7a5a0c}
.chip.rojo{background:#fbe0e1;color:#9e1c22}
button.chip{border:0;cursor:pointer}

.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat div{background:var(--papel);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-family:Fraunces,serif}
.stat span{font-size:12px;color:var(--gris)}

.info{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:15px}
.info .k{font-size:18px}

.count{display:flex;gap:8px;justify-content:center;margin-top:12px}
.count div{background:var(--pino);color:#fff;border-radius:12px;padding:8px 10px;min-width:62px;text-align:center}
.count b{display:block;font-size:22px;font-family:Fraunces,serif;color:var(--oro2)}
.count span{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub)}

.person{border:2px solid var(--linea);border-radius:16px;padding:12px;margin:10px 0;background:#fff}
.person .name{font-weight:800;font-size:16px}
.person .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pin{font-family:ui-monospace,Menlo,monospace;font-weight:800;background:var(--papel);border-radius:8px;padding:2px 7px;letter-spacing:2px}

.wish{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--linea)}
.wish:last-child{border-bottom:0}
.wish .t{font-weight:700}
.wish.bought .t{text-decoration:line-through;color:var(--gris)}
.wish .ph{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;cursor:zoom-in;border:2px solid var(--linea)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--linea);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none;font-size:15px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.star{background:none;border:0;font-size:22px;cursor:pointer;padding:0 2px;filter:grayscale(1);opacity:.45}
.star.on{filter:none;opacity:1}
.foto-prev{display:flex;align-items:center;gap:10px;margin-top:10px}
.foto-prev img{width:70px;height:70px;object-fit:cover;border-radius:12px;border:2px solid var(--linea)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.pinbox{display:flex;gap:10px;justify-content:center;margin:18px 0}
.pinbox input{width:58px;height:66px;text-align:center;font-size:30px;font-weight:800;border-radius:14px;padding:0}

.gift{width:180px;height:180px;margin:10px auto;cursor:pointer;position:relative;border:0;background:none;display:block}
.gift .box{position:absolute;bottom:0;left:15px;width:150px;height:110px;background:var(--rojo);border-radius:10px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.15)}
.gift .lid{position:absolute;bottom:105px;left:5px;width:170px;height:38px;background:var(--rojoA);border-radius:10px;transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.gift .rv{position:absolute;bottom:0;left:80px;width:20px;height:143px;background:var(--oro)}
.gift .bow{position:absolute;bottom:138px;left:62px;font-size:44px;transition:transform .5s}
.gift.shake{animation:shake .5s ease-in-out 2}
.gift.open .lid{transform:translateY(-70px) rotate(-18deg)}
.gift.open .bow{transform:translateY(-80px) rotate(-25deg)}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

.big-name{font-family:Fraunces,serif;font-size:38px;font-weight:800;color:var(--rojo);text-align:center;margin:6px 0 2px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px 2px 8px}
.msg{max-width:82%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.35}
.msg.me{align-self:flex-end;background:var(--pino2);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--papel);border-bottom-left-radius:4px}
.msg time{display:block;font-size:11px;opacity:.7;margin-top:3px}

.pista{background:var(--papel);border-radius:14px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}
.pista .n{font-family:Fraunces,serif;font-weight:800;font-size:18px;color:var(--rojo);flex:none}
.pista.lock{opacity:.75}

.idea{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--linea)}
.idea:last-child{border-bottom:0}
.idea .e{font-size:22px;flex:none}

.seg{display:flex;background:var(--papel);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:800;color:var(--gris);cursor:pointer}
.seg button.on{background:#fff;color:var(--tinta);box-shadow:0 2px 6px rgba(0,0,0,.08)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb, var(--noche) 96%, transparent);backdrop-filter:blur(8px);
  border-top:1px solid rgba(255,255,255,.1);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.adv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.adv button{aspect-ratio:1;border-radius:14px;border:2px solid var(--linea);background:#fff;font-family:Fraunces,serif;font-weight:800;font-size:22px;color:var(--rojo);cursor:pointer;position:relative}
.adv button.hoy{background:linear-gradient(180deg,var(--oro2),var(--oro));color:#3b2a06;border-color:var(--oro);animation:latido 1.6s ease-in-out infinite}
.adv button.abierto{background:var(--papel);color:var(--gris)}
.adv button.abierto::after{content:attr(data-ico);position:absolute;right:4px;bottom:2px;font-size:13px}
.adv button[disabled]{opacity:.45;cursor:default;color:var(--gris)}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.adv button.hoy{animation:none}}
.opcion{display:block;width:100%;text-align:left;margin:8px 0}
.tiendas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tiendas a{font-size:11.5px;font-weight:800;text-decoration:none;border-radius:999px;padding:3px 9px;background:#eef3ff;color:#24406b}
.nav button{background:none;border:0;color:var(--navtx);font-weight:800;font-size:11px;padding:6px 0;border-radius:12px;cursor:pointer;position:relative}
.nav button .i{display:block;font-size:22px;margin-bottom:2px}
.nav button.on{color:var(--oro2);background:rgba(255,255,255,.06)}
.dot{position:absolute;top:4px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:#e23b42;border:2px solid var(--noche)}

#fab{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:6;width:46px;height:46px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);background:color-mix(in srgb, var(--pino) 90%, transparent);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#fab.on{background:var(--oro);color:#3b2a06;border-color:var(--oro2)}
body.sin-nav #fab{bottom:calc(18px + env(safe-area-inset-bottom))}
body.sin-nav{padding-bottom:30px}

.banner{background:linear-gradient(135deg,var(--oro2),var(--oro));color:#3b2a06;border-radius:18px;padding:14px;margin:14px 0;box-shadow:var(--sombra)}
.banner b{font-family:Fraunces,serif;font-size:17px}
.banner.azul{background:linear-gradient(135deg,#cfe3ff,#9cc2f5);color:#10294d}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:rgba(255,255,255,.6);border-radius:8px;padding:8px;word-break:break-all;margin:8px 0}

.empty{text-align:center;padding:14px;color:var(--gris)}
.empty .e{font-size:40px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:#2a1f17;color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;z-index:40;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#9e1c22}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:grid;place-items:center;padding:20px;overflow:auto}
.modal .card{max-width:440px;width:100%;margin:0;max-height:88vh;overflow:auto}
.modal img.full{width:100%;border-radius:14px;display:block}

.spinner{width:36px;height:36px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--oro2);border-radius:50%;animation:spin 1s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{text-align:center;color:#7fa18a;font-size:12px;margin-top:20px}
body.trabajo .foot{color:#8090a8}
.list-link{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid var(--linea);border-radius:14px;margin:8px 0;text-decoration:none;color:var(--tinta);background:#fff}
.list-link b{flex:1}
details summary{cursor:pointer;font-weight:800;font-size:16px}
details > div{margin-top:10px}
.opt{border:2px solid var(--linea);border-radius:14px;padding:12px;margin:10px 0;background:#fff}
.opt b{display:block}

/* ---------- Manual ---------- */
.paso{display:flex;gap:12px;margin:16px 0}
.paso .num{width:32px;height:32px;border-radius:50%;background:var(--rojo);color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.paso img{width:100%;max-width:260px;border-radius:16px;border:3px solid var(--linea);margin-top:8px;display:block}

/* ---------- Pantalla de TV ---------- */
.tv{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:4vh 4vw;z-index:2}
.tv .t1{font-size:clamp(18px,3vw,34px);color:var(--sub);font-weight:700}
.tv .t2{font-family:Fraunces,serif;font-weight:800;font-size:clamp(44px,9vw,120px);line-height:1.05;margin:1vh 0;text-shadow:0 8px 30px rgba(0,0,0,.4)}
.tv .t2.oro{color:var(--oro2)}
.tv .t3{font-family:Fraunces,serif;font-weight:800;font-size:clamp(60px,12vw,170px);color:var(--oro2);animation:pop .8s cubic-bezier(.2,1.6,.4,1);text-shadow:0 10px 40px rgba(0,0,0,.45)}
.tv .ctrl{position:fixed;bottom:3vh;left:0;right:0;display:flex;gap:12px;justify-content:center;align-items:center}
.tv .btn{font-size:clamp(16px,2vw,24px);padding:14px 28px}
.tv .prog{position:fixed;top:3vh;right:3vw;font-weight:800;color:var(--sub);font-size:clamp(14px,1.6vw,22px)}
.tv .redoble{font-size:clamp(60px,10vw,140px);animation:shake .25s infinite}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:50}
.tv .back{position:fixed;top:3vh;left:3vw;z-index:3}
.tv .back .btn{font-size:clamp(13px,1.4vw,18px);padding:8px 14px;color:#fff;border-color:rgba(255,255,255,.3)}
.tvmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(30vw,260px),1fr));gap:2.2vh 2vw;width:min(92vw,1100px);margin-top:3vh}
.tvmenu button{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);color:#fff;border-radius:22px;padding:2vh 1vw;cursor:pointer;font-family:inherit}
.tvmenu button:hover,.tvmenu button:focus{background:rgba(255,255,255,.16);border-color:var(--oro2);outline:none}
.tvmenu button b{display:block;font-family:Fraunces,serif;font-size:clamp(20px,2.4vw,34px);margin-top:1vh}
.tvmenu button span{display:block;font-size:clamp(34px,4.6vw,68px)}
.tvmenu button small{display:block;color:var(--sub);font-size:clamp(12px,1.2vw,16px);margin-top:.6vh}
.tvmenu button[disabled]{opacity:.45;cursor:default}
.tvfoto{max-height:34vh;max-width:60vw;border-radius:18px;border:4px solid var(--oro2);box-shadow:0 14px 40px rgba(0,0,0,.5);margin-top:2vh;animation:pop .8s}
.rueda{display:flex;gap:4vw;align-items:center;justify-content:center;width:100%;margin-bottom:8vh}
.rueda-cv{position:relative}
.rueda-cv::after{content:'▼';position:absolute;top:-1.2vh;left:50%;transform:translateX(-50%);color:var(--oro2);font-size:clamp(28px,4vw,56px);text-shadow:0 4px 10px rgba(0,0,0,.5)}
.orden{background:rgba(255,255,255,.08);border-radius:18px;padding:2vh 2vw;min-width:22vw;text-align:left;max-height:70vh;overflow:auto}
.orden h3{color:var(--oro2);font-size:clamp(18px,2vw,28px);margin-bottom:1vh}
.orden div{font-size:clamp(15px,1.6vw,22px);padding:.4vh 0}
.tvbox{background:rgba(255,255,255,.08);border-radius:20px;padding:2.4vh 2.4vw;width:min(92vw,1100px)}
.tvop{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.4vw;width:min(92vw,1100px);margin-top:2vh}
.tvop div{background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.2);border-radius:18px;padding:2vh 1.4vw;font-size:clamp(18px,2.4vw,34px);font-weight:800;text-align:left}
.tvop div.ok{background:#2a7a4d;border-color:#7fe0a8}
.tvop div.no{opacity:.4}
.timer{height:1.4vh;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;width:min(92vw,1100px);margin-top:2vh}
.timer i{display:block;height:100%;background:var(--oro2);transition:width 1s linear}
.equipos{display:flex;gap:1.4vw;flex-wrap:wrap;justify-content:center;margin-top:2vh}
.equipo{background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.2);border-radius:16px;padding:1.2vh 1.6vw;color:#fff;font-weight:800;font-size:clamp(15px,1.8vw,24px);cursor:pointer;font-family:inherit}
.equipo.on{background:#2a7a4d;border-color:#7fe0a8}
.equipo b{display:block;font-family:Fraunces,serif;font-size:clamp(24px,3vw,44px);color:var(--oro2)}
.regalos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(26vw,230px),1fr));gap:1.4vh 1.2vw;width:min(94vw,1200px);margin-top:2vh;max-height:46vh;overflow:auto}
.regalo{background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.2);border-radius:16px;padding:1.4vh 1vw;text-align:left;color:#fff;font-family:inherit;font-size:clamp(14px,1.5vw,20px)}
.regalo b{display:block;font-size:clamp(16px,1.8vw,24px)}
button.regalo{cursor:pointer}
button.regalo:hover{border-color:var(--oro2)}
.regalo.frio{opacity:.55}
.regalo[disabled]{opacity:.35;cursor:default}
.tvinput{font-size:clamp(18px,2vw,28px);padding:1.4vh 1.2vw;border-radius:14px;border:3px solid var(--oro2);width:min(80vw,700px)}
.slide{max-width:88vw;max-height:72vh;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .7s}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.album div{position:relative}
.album img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;display:block}
.album button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer}
</style>

  tr(s){
    const k = s.trim().replace(/[ \t]*\n[ \t]*/g, '\n').replace(/[ \t]{2,}/g, ' '); if (!k) return s;
    let en = this.dict[k];
    if (en === undefined && k.includes('\n')) en = this.dict[k.replace(/\s+/g, ' ')];
    if (en === undefined){
      for (const [re, f] of this.pats){ const m = k.match(re); if (m){ en = typeof f === 'function' ? f(...m) : k.replace(re, f); break; } }

    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => this.salta(n.parentNode) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});

/* Reduce una foto a ~600px en JPEG para guardarla ligera */
function reducirFoto(file){
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Elige una imagen'));
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let q = .78, max = 600, out;
        for (let i = 0; i < 5; i++){
          const s = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', q);
          if (out.length < 200000) break;
          q -= .12; max -= 100;
        }
        out.length < 240000 ? res(out) : rej(new Error('La foto es muy pesada'));
      };
      img.onerror = () => rej(new Error('No se pudo leer la imagen'));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ============================ NOTIFICACIONES (Web Push) ============================ */
const Push = {
  soportado(){ return !!PUSH_PUBLIC_KEY && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
  esIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); },
  necesitaInstalar(){ return this.esIOS() && !esApp(); },
  async registro(){ return navigator.serviceWorker.register('sw.js'); },
  clave(){ const b = PUSH_PUBLIC_KEY.replace(/-/g, '+').replace(/_/g, '/'); const r = atob(b + '==='.slice((b.length + 3) % 4)); return Uint8Array.from(r, c => c.charCodeAt(0)); },
  async activo(){
    if (!this.soportado() || Notification.permission !== 'granted') return false;
    try{ const reg = await navigator.serviceWorker.getRegistration(); return !!(reg && await reg.pushManager.getSubscription()); }catch(e){ return false; }
  },
  async suscribir(){
    if (!this.soportado()) throw new Error('Este navegador no permite notificaciones');
    if (this.necesitaInstalar()) throw new Error('En iPhone primero instala la app (Compartir → Agregar a inicio) y ábrela desde su ícono');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('No diste permiso de notificaciones. Actívalo en los ajustes del navegador.');
    const reg = await this.registro(); await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: this.clave()});
    return sub.toJSON();
  },
  avisar(datos){
    if (!PUSH_PUBLIC_KEY) return;
    fetch(SUPABASE_URL.replace(/\/$/, '') + '/functions/v1/push', {method: 'POST', headers: {'Content-Type': 'application/json', apikey: SUPABASE_KEY}, body: JSON.stringify(datos)})
      .then(r => r.json()).then(r => { if (datos.tipo === 'prueba') toast(r.error ? '⚠️ ' + r.error : (r.enviados ? '🔔 Prueba enviada' : '⚠️ No hay celulares registrados'), !!r.error); })
      .catch(() => { if (datos.tipo === 'prueba') toast('⚠️ Falta crear la función «push» en Supabase', true); });
  }
};
if ('serviceWorker' in navigator && PUSH_PUBLIC_KEY) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ============================ AUDIOS ANÓNIMOS (voz distorsionada en el celular) ============================ */
const Audio8 = {
  efectos: [['ardilla','🐿️','Ardilla'],['robot','🤖','Robot'],['grave','🐻','Grave'],['normal','🙂','Normal']],
  async procesar(blob, efecto){
    const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC();
    const ab = await blob.arrayBuffer();
    const buf = await new Promise((ok, mal) => ctx.decodeAudioData(ab, ok, mal));
    ctx.close && ctx.close();
    const tasa = {ardilla: 1.5, grave: .72, robot: 1.05, normal: 1}[efecto] || 1, sr = 11025;
    const off = new OfflineAudioContext(1, Math.ceil(buf.duration / tasa * sr) + sr / 10, sr);
    const src = off.createBufferSource(); src.buffer = buf; src.playbackRate.value = tasa;
    if (efecto === 'robot'){
      const g = off.createGain(); g.gain.value = 0; const o = off.createOscillator(); o.frequency.value = 55; o.connect(g.gain); o.start();
      src.connect(g); g.connect(off.destination);
    } else src.connect(off.destination);
    src.start();
    const out = (await off.startRendering()).getChannelData(0);
    let max = 0; for (let i = 0; i < out.length; i++) max = Math.max(max, Math.abs(out[i]));
    const k = max > 0 ? .95 / max : 1;
    const n = out.length, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, t) => { for (let i = 0; i < t.length; i++) b[o + i] = t.charCodeAt(i); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) b[44 + i] = Math.max(0, Math.min(255, Math.round(out[i] * k * 127 + 128)));
    let s = ''; for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
    return 'data:audio/wav;base64,' + btoa(s);
  }
};

function confeti(n = 160){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confeti'), x = c.getContext('2d');
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; x.scale(devicePixelRatio, devicePixelRatio);
  const cols = document.body.classList.contains('trabajo') ? ['#e8cf8a','#c9a54e','#ffffff','#9cc2f5','#2f5288'] : ['#d4343b','#f3d27a','#2a7a4d','#ffffff','#d9a93a'];
  const ps = Array.from({length:n}, () => ({x: innerWidth/2 + (Math.random()-.5)*innerWidth*.4, y: innerHeight*.35, vx:(Math.random()-.5)*14, vy: -Math.random()*14-4,
    w: 6+Math.random()*7, h: 8+Math.random()*10, r: Math.random()*6, vr:(Math.random()-.5)*.3, c: cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function paso(t){
    x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w/2, -p.h/2, p.w, p.h*Math.abs(Math.cos(p.r*2))); x.restore(); });
    if (t - t0 < 4200) requestAnimationFrame(paso); else x.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

/* ============================ MÚSICA (villancicos de dominio público, sintetizados) ============================ */
const Musica = {
  ctx: null, master: null, on: false, timer: null, t: 0, i: 0, cancion: 0,
  N: (() => { const m = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}; return s => { const n = m[s[0]] + (s[1]==='#'?1:0); const o = +s[s.length-1]; return 440*Math.pow(2, (n + (o-4)*12 - 9)/12); }; })(),
  canciones: [
    // Jingle Bells (James Lord Pierpont, 1857)
    {tempo:.28, notas:'E4:1 E4:1 E4:2 E4:1 E4:1 E4:2 E4:1 G4:1 C4:1.5 D4:.5 E4:4 F4:1 F4:1 F4:1.5 F4:.5 F4:1 E4:1 E4:1 E4:.5 E4:.5 E4:1 D4:1 D4:1 E4:1 D4:2 G4:2 E4:1 E4:1 E4:2 E4:1 E4:1 E4:2 E4:1 G4:1 C4:1.5 D4:.5 E4:4 F4:1 F4:1 F4:1.5 F4:.5 F4:1 E4:1 E4:1 E4:.5 E4:.5 G4:1 G4:1 F4:1 D4:1 C4:4 -:2'},
    // Noche de Paz (Franz Gruber, 1818)
    {tempo:.24, notas:'G4:3 A4:1 G4:2 E4:6 G4:3 A4:1 G4:2 E4:6 D5:4 D5:2 B4:6 C5:4 C5:2 G4:6 A4:4 A4:2 C5:3 B4:1 A4:2 G4:3 A4:1 G4:2 E4:6 A4:4 A4:2 C5:3 B4:1 A4:2 G4:3 A4:1 G4:2 E4:6 D5:4 D5:2 F5:3 D5:1 B4:2 C5:6 E5:6 C5:3 G4:1 E4:2 G4:3 F4:1 D4:2 C4:12 -:4'}
  ],
  iniciar(){
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .13; this.master.connect(this.ctx.destination);
    return true;
  },
  campana(freq, t, dur, vol = 1){
    const c = this.ctx, g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(0.0008, t + Math.max(.45, dur*1.1));
    g.connect(this.master);
    [[1,'sine',1],[2,'sine',.35],[3,'triangle',.12]].forEach(([m, tipo, v]) => {
      const o = c.createOscillator(), og = c.createGain(); o.type = tipo; o.frequency.value = freq*m; og.gain.value = v;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + Math.max(.5, dur*1.2));
    });
  },
  programar(){
    const c = this.ctx;
    while (this.t < c.currentTime + .6){
      const song = this.canciones[this.cancion], notas = song.notas.split(' ');
      if (this.i >= notas.length){ this.i = 0; this.cancion = (this.cancion + 1) % this.canciones.length; continue; }
      const [n, b] = notas[this.i].split(':'); const dur = +b * song.tempo;
      if (n !== '-'){ this.campana(this.N(n), this.t, dur); if (this.i % 4 === 0) this.campana(this.N(n)/2, this.t, dur, .35); }
      this.t += dur; this.i++;
    }
  },
  alternar(){
    if (!this.iniciar()) return toast('Tu navegador no permite música', true);
    this.on = !this.on;
    if (this.on){ this.ctx.resume(); this.t = this.ctx.currentTime + .1; this.programar(); this.timer = setInterval(() => this.programar(), 150); }
    else clearInterval(this.timer);
    this.pintar();
  },
  pintar(){ const f = $('#fab'); f.classList.toggle('on', this.on); f.textContent = this.on ? '🔊' : '🎵'; },
  efecto(tipo){
    if (!this.iniciar()) return; const c = this.ctx; c.resume(); const t = c.currentTime;
    if (tipo === 'clic'){
      const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .08); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + .09); return;
    }
    if (tipo === 'redoble'){
      const len = 2.2, buf = c.createBuffer(1, c.sampleRate*len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++){ const s = i / c.sampleRate; d[i] = (Math.random()*2-1) * (.35 + .65*Math.abs(Math.sin(s*Math.PI*22))) * (s/len*.8 + .2); }
      const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); f.type = 'bandpass'; f.frequency.value = 900; g.gain.value = 1.4;
      src.buffer = buf; src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
    } else {
      ['C5','E5','G5','C6'].forEach((n, k) => this.campana(this.N(n), t + k*.09, .9, .9));
    }
  }
};
$('#fab').onclick = () => Musica.alternar();

function ideasPara(perfil, monto, max = 6){
  const p = perfil || {};
  const txt = norm([p.gustos, p.colores].join(' '));
  const evitar = norm([p.evitar, p.yatengo].join(' '));
  const maxP = monto ? monto * 1.1 : 600, minP = monto ? monto * .35 : 0;
  const lista = IDEAS.filter(([e, t, pr, k]) => pr <= maxP && pr >= minP && !(evitar && (norm(t).split(/\s+/).some(w => w.length > 3 && evitar.includes(w)) || k.split(' ').some(w => w && evitar.includes(w)))))
    .map(i => ({i, s: i[3].split(' ').filter(w => w && txt.includes(w)).length + Math.random()*.5}))
    .sort((a, b) => b.s - a.s).slice(0, max).map(x => x.i);
  return lista;
}

function diaAdviento(){
  const h = new Date(), m = h.getMonth();
  if (m === 11) return Math.min(h.getDate(), 24);

/* ============================ SUPABASE ============================ */
const configurado = !SUPABASE_URL.includes('PEGA_') && !SUPABASE_KEY.includes('PEGA_');
async function rpc(fn, args = {}){
  const headers = {'Content-Type':'application/json', 'apikey': SUPABASE_KEY};
  if (SUPABASE_KEY.startsWith('eyJ')) headers['Authorization'] = 'Bearer ' + SUPABASE_KEY;
  let r;
  try{
    r = await fetch(SUPABASE_URL.replace(/\/$/,'') + '/rest/v1/rpc/' + fn, {method:'POST', headers, body: JSON.stringify(args)});
  }catch(e){ throw new Error('Sin conexión. Revisa tu internet.'); }
  const txt = await r.text();
  let data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if (!r.ok){
    const m = (data && data.message) || '';
    if (/Could not find the function|schema cache/i.test(m)) throw new Error('Falta actualizar la base de datos: corre intercambio.sql en Supabase');
    throw new Error(m || 'Error del servidor (' + r.status + ')');
  }
  return data;
}
async function hacer(btn, fn){
  if (btn){ btn.disabled = true; }
  try{ return await fn(); }
  catch(e){ toast(e.message, true); throw e; }
  finally{ if (btn) btn.disabled = false; }
}

function abrirAjustes(ctx = {}){
  const a = Ajustes.get();
  const grupo = (clave, ops) => `<div class="opciones">${ops.map(([v, t]) => `<button data-aj="${clave}" data-v="${v}" class="${String(a[clave]) === String(v) ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  const r = modal(`<h2>⚙️ Ajustes</h2>
    <div class="ajuste"><b>🌐 Idioma</b>${grupo('lang', [['es','🇲🇽 Español'],['en','🇺🇸 English']])}</div>
    <div class="ajuste"><b>🎨 Apariencia</b>${grupo('modo', [['clasico','Clásico'],['oscuro','🌙 Oscuro'],['claro','☀️ Claro']])}</div>
    <div class="ajuste"><b>🔊 Sonidos al tocar</b>${grupo('sonidos', [[true,'Sí'],[false,'No']])}</div>
    <div class="ajuste"><b>❄️ Nieve al tocar el fondo</b>${grupo('nieve', [[true,'Sí'],[false,'No']])}</div>
    ${ctx.push ? `<div class="ajuste"><b>🔔 Notificaciones</b><span id="ajPush"><button class="btn xs oro" id="ajPushBtn">Activar</button></span></div>` : ''}
    <button class="btn ghost full mt" data-x="ok">Listo</button>`);
  r.querySelectorAll('[data-aj]').forEach(b => b.onclick = () => {
    const k = b.dataset.aj; let v = b.dataset.v; if (v === 'true') v = true; if (v === 'false') v = false;
    Ajustes.set({[k]: v});
    if (k === 'lang'){ closeModal(); Promise.resolve(ctx.onLang ? ctx.onLang(v) : null).finally(() => location.reload()); return; }
    closeModal(); abrirAjustes(ctx); if (ctx.onCambio) ctx.onCambio();
  });
  r.querySelector('[data-x=ok]').onclick = () => { closeModal(); if (ctx.onCambio) ctx.onCambio(); };
  if (ctx.push){
    Push.activo().then(on => { const s = document.getElementById('ajPush'); if (s && on) s.innerHTML = '<span class="chip ok">✓ Activadas</span>'; });
    const pb = document.getElementById('ajPushBtn'); if (pb) pb.onclick = () => hacer(pb, async () => { await ctx.push(); closeModal(); abrirAjustes(ctx); });
  }
}

/* ============================ PANTALLA DE TV ============================ */
const TV = {
  code: null, info: null, modo: 'menu', st: {},
  async iniciar(code){
    this.code = code; sinNav(); $('#fab').style.display = 'none';
    try{ this.info = await rpc('ix_tv_info', {p_admin: code}); }
    catch(e){
      app.innerHTML = `<div class="hero"><div class="emoji">📺</div><h1>Pantalla de TV</h1><p>${esc(e.message)}</p></div><div class="center"><a class="btn oro" href="?admin=${esc(code)}">Ir al panel</a></div>`;
      return;
    }
    aplicarTema(this.info.tema);
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if ([' ', 'Enter', 'ArrowRight', 'PageDown'].includes(e.key)){ const go = $('#go'); if (go){ e.preventDefault(); go.click(); } }
      if (e.key === 'Escape' && this.modo !== 'menu') this.ir('menu');
    });
    this.ir('menu');
  },
  async ir(modo){
    clearInterval(this.st.timer); clearTimeout(this.st.timer2);
    this.modo = modo; this.st = {};
    if (modo === 'rev'){
      try{ this.d = await rpc('ix_tv', {p_admin: this.code}); }catch(e){ toast(e.message, true); return this.ir('menu'); }
      this.i = -1; this.fase = 'inicio';
    }
    if (modo === 'album'){
      try{ this.st.fotos = await rpc('ix_admin_album', {p_admin: this.code}); }catch(e){ toast(e.message, true); return this.ir('menu'); }
      this.st.i = 0; this.st.timer = setInterval(() => { if (this.st.fotos.length){ this.st.i = (this.st.i + 1) % this.st.fotos.length; this.render(); } }, 6000);
    }
    if (modo === 'ruleta'){
      const guard = store.get('ix_ruleta_' + this.code, null);
      const todos = this.info.personas.filter(p => p.asistencia !== 'no').map(p => p.nombre);
      this.st.orden = guard && guard.orden ? guard.orden.filter(n => todos.includes(n)) : [];
      this.st.restantes = todos.filter(n => !this.st.orden.includes(n));
      this.st.ang = 0;
    }
    if (modo === 'robado'){
      const g = store.get('ix_robado_' + this.code, null);
      if (g && g.jugadores) this.st = g; else this.st = {fase: 'config', max: 3};
    }
    if (modo === 'trivia') this.st = {fase: 'config', n: 2, nombres: ['🔴 Rojos','🟢 Verdes','🟡 Dorados','🔵 Azules']};
    this.render();
  },
  marco(h, atras = true){ return `<div class="tv">${atras && this.modo !== 'menu' ? '<div class="back"><button class="btn ghost" id="tvBack">‹ Menú</button></div>' : ''}${h}</div>`; },
  render(){
    const f = {menu: 'vMenu', rev: 'vRev', ruleta: 'vRuleta', trivia: 'vTrivia', robado: 'vRobado', album: 'vAlbum'}[this.modo];
    app.innerHTML = this.marco(this[f]());
    const b = $('#tvBack'); if (b) b.onclick = () => this.ir('menu');
    const go = $('#go'); if (go && this._go) go.onclick = this._go;
    this.enlazar();
  },
  enlazar(){
    app.querySelectorAll('[data-modo]').forEach(b => b.onclick = () => this.ir(b.dataset.modo));
    if (this.modo === 'rev'){ const go = $('#go'); if (go) go.onclick = () => this.avanzarRev(); }
    if (this.modo === 'ruleta') this.enlazarRuleta();
    if (this.modo === 'trivia') this.enlazarTrivia();
    if (this.modo === 'robado') this.enlazarRobado();
    if (this.modo === 'album'){
      const nx = $('#go'); if (nx) nx.onclick = () => { if (this.st.fotos.length){ this.st.i = (this.st.i + 1) % this.st.fotos.length; this.render(); } };
      const pv = $('#tvPrev'); if (pv) pv.onclick = () => { if (this.st.fotos.length){ this.st.i = (this.st.i - 1 + this.st.fotos.length) % this.st.fotos.length; this.render(); } };
    }
    const mu = $('#tvMusica'); if (mu) mu.onclick = () => { Musica.alternar(); this.render(); };
  },

  /* ---------- MENÚ ---------- */
  vMenu(){
    const i = this.info;
    const tiles = [
      ['rev','🎅','Revelación de Santas', i.revelado ? 'Uno por uno, con redoble y confeti' : (i.sorteado ? 'Activa «Revelar Santas» en el panel' : 'Primero haz el sorteo'), !i.revelado],
      ['ruleta','🎡','Ruleta','¿A quién le toca abrir su regalo?', false],
      ['trivia','❓','Trivia familiar', i.trivia.length ? i.trivia.length + ' preguntas · por equipos' : 'Preguntas navideñas de ejemplo', false],
      ['robado','🔄','Modo robado','Abre o roba un regalo', false],
      ['album','📸','Álbum', i.fotos ? i.fotos + (i.fotos === 1 ? ' foto' : ' fotos') + ' en presentación' : 'Aún no hay fotos', false]
    ];
    return `<img src="icon-512.png" alt="" style="width:min(14vh,130px);border-radius:24%;box-shadow:0 14px 40px rgba(0,0,0,.5)">
      <div class="t2" style="font-size:clamp(34px,5vw,70px)">${esc(i.nombre)}</div><div class="t1">¿Qué hacemos?</div>
      <div class="tvmenu">${tiles.map(([m, e, t, d, dis]) => `<button data-modo="${m}" ${dis ? 'disabled' : ''}><span>${e}</span><b>${t}</b><small>${esc(d)}</small></button>`).join('')}</div>
      <div style="margin-top:2.4vh"><button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="tvMusica">${Musica.on ? '🔊 Música' : '🎵 Música'}</button></div>`;
  },

  /* ---------- REVELACIÓN ---------- */
  async avanzarRev(){
    if (this.fase === 'inicio'){ if (!Musica.on) Musica.alternar(); this.i = 0; this.fase = 'pregunta'; }
    else if (this.fase === 'pregunta'){
      const p = this.d.pares[this.i];
      this.fase = 'redoble'; this.render(); if (Musica.on){ Musica.alternar(); this._musica = true; } Musica.efecto('redoble');
      const espera = new Promise(r => setTimeout(r, 2300));
      this.fotoActual = null;
      if (p.foto){ try{ this.fotoActual = await rpc('ix_tv_foto', {p_admin: this.code, p_id: p.id}); }catch(e){} }
      await espera;
      this.fase = 'revelado'; this.render(); confeti(220); Musica.efecto('campanas'); return;
    }
    else if (this.fase === 'revelado'){ this.i++; this.fase = this.i >= this.d.pares.length ? 'fin' : 'pregunta'; if (this._musica && !Musica.on){ Musica.alternar(); } if (this.fase === 'fin') confeti(260); }
    else if (this.fase === 'fin'){ this.fase = 'inicio'; this.i = -1; }
    else return;
    this.render();
  },
  vRev(){
    const p = this.d.pares[this.i] || {}, total = this.d.pares.length;
    const prog = this.i >= 0 && this.i < total ? `<div class="prog">${this.i + 1} de ${total}</div>` : '';
    if (this.fase === 'inicio') return prog + `<div style="font-size:min(16vh,140px)">🎅</div>
      <div class="t2">Revelación de Santas</div><div class="t1">${total} participantes</div>
      <div class="ctrl"><button class="btn oro" id="go">▶ Comenzar</button></div>`;
    if (this.fase === 'pregunta') return prog + `${p.av_para ? `<img src="${esc(p.av_para)}" alt="" style="width:min(20vh,160px);height:min(20vh,160px);border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 14px 40px rgba(0,0,0,.5)">` : ''}<div class="t1">¿Quién le regaló a…</div><div class="t2">${esc(p.para)}?</div>
      <div class="ctrl"><button class="btn rojo" id="go">🥁 Revelar</button></div>`;
    if (this.fase === 'redoble') return prog + `<div class="t1">El Santa de ${esc(p.para)} es…</div><div class="redoble">🥁</div>`;
    if (this.fase === 'revelado') return prog + `${p.av_de && !this.fotoActual ? `<img src="${esc(p.av_de)}" alt="" style="width:min(22vh,180px);height:min(22vh,180px);border-radius:50%;object-fit:cover;border:5px solid var(--oro2);box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pop .8s">` : ''}
      <div class="t1">El Santa de <b>${esc(p.para)}</b> fue</div><div class="t3" style="${this.fotoActual ? 'font-size:clamp(44px,8vw,110px)' : ''}">${esc(p.de)}</div>
      ${this.fotoActual ? `<img class="tvfoto" src="${esc(this.fotoActual)}" alt="Regalo"><div class="t1" style="font-size:clamp(14px,1.6vw,20px)">🎁 Esto le compró</div>` : ''}
      ${p.voto ? `<div class="t1" style="margin-top:1.4vh">${p.atino ? `🎯 ¡${esc(p.para)} le atinó!` : `😅 ${esc(p.para)} creía que era ${esc(p.creia)}`}</div>` : ''}
      <div class="ctrl"><button class="btn oro" id="go">${this.i + 1 < total ? 'Siguiente ›' : 'Terminar 🎉'}</button></div>`;
    const at = this.d.pares.filter(x => x.atino);
    return `<div style="font-size:min(16vh,140px)">🎄</div><div class="t2 oro">¡Feliz Navidad!</div><div class="t1">Gracias por participar en ${esc(this.info.nombre)}</div>
      ${at.length ? `<div class="t1" style="margin-top:2vh">🕵️ Detectives que adivinaron a su Santa: <b style="color:var(--oro2)">${at.map(x => esc(x.para)).join(', ')}</b></div>` : ''}
      <div class="ctrl"><button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="go">↺ Volver a empezar</button></div>`;
  },

  /* ---------- RULETA ---------- */
  vRuleta(){
    const st = this.st, n = st.restantes.length;
    const lado = 'min(58vh,44vw)';
    return `<div class="t2" style="font-size:clamp(26px,3.4vw,48px);margin:0 0 2vh">🎡 ¿A quién le toca abrir su regalo?</div>
      <div class="rueda">
        <div class="rueda-cv">${n ? `<canvas id="cv" style="width:${lado};height:${lado}"></canvas>` : `<div class="t1" style="width:${lado}">🎉 ¡Ya salieron todos!</div>`}</div>
        <div class="orden">${st.ganador ? `<div style="font-family:Fraunces,serif;font-weight:800;color:var(--oro2);font-size:clamp(28px,4vw,60px);line-height:1.1;animation:pop .8s">🎁 ¡${esc(st.ganador)}!</div><div style="color:var(--sub);margin-bottom:1.4vh">abre su regalo</div>` : ''}<h3>Orden</h3>${st.orden.length ? st.orden.map((x, k) => `<div>${k + 1}. ${esc(x)}</div>`).join('') : '<div style="color:var(--sub)">Gira la ruleta…</div>'}</div>
      </div>
      <div class="ctrl">${n ? `<button class="btn oro" id="go" ${st.girando ? 'disabled' : ''}>🎡 ${st.orden.length ? 'Girar otra vez' : 'Girar'}</button>` : ''}
        <button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="rReset">↺ Reiniciar</button></div>`;
  },
  dibujarRueda(){
    const cv = $('#cv'); if (!cv) return;
    const names = this.st.restantes, n = names.length, px = cv.clientWidth * devicePixelRatio;
    cv.width = cv.height = px; const x = cv.getContext('2d'), r = px / 2;
    const cols = document.body.classList.contains('trabajo') ? ['#24406b','#c9a54e','#2f5288','#e8cf8a'] : ['#c0262d','#1e5b3a','#d9a93a','#9e1c22','#2a7a4d','#f3d27a'];
    x.translate(r, r); x.rotate(this.st.ang);
    for (let k = 0; k < n; k++){
      const a0 = k * 2 * Math.PI / n - Math.PI / 2, a1 = a0 + 2 * Math.PI / n;
      x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, r - 6, a0, a1); x.closePath();
      x.fillStyle = cols[k % cols.length]; if (n % cols.length === 1 && k === n - 1) x.fillStyle = cols[1]; x.fill();
      x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 3; x.stroke();
      x.save(); x.rotate((a0 + a1) / 2); x.textAlign = 'right'; x.textBaseline = 'middle';
      const claro = ['#d9a93a','#f3d27a','#c9a54e','#e8cf8a'].includes(x.fillStyle);
      x.fillStyle = claro ? '#3b2a06' : '#fff'; x.font = `800 ${Math.max(14, Math.min(px / 14, px * 1.6 / n))}px Nunito, sans-serif`;
      const t = names[k].length > 14 ? names[k].slice(0, 13) + '…' : names[k];
      x.fillText(t, r - 22, 0); x.restore();
    }
    x.beginPath(); x.arc(0, 0, px * .07, 0, 2 * Math.PI); x.fillStyle = '#fffaf0'; x.fill(); x.lineWidth = 5; x.strokeStyle = '#d9a93a'; x.stroke();
  },
  enlazarRuleta(){
    this.dibujarRueda();
    const go = $('#go'); if (go) go.onclick = () => this.girar();
    const rs = $('#rReset'); if (rs) rs.onclick = () => { store.del('ix_ruleta_' + this.code); this.ir('ruleta'); };
  },
  girar(){
    const st = this.st; if (st.girando) return;
    if (st.ganador){ st.restantes = st.restantes.filter(x => x !== st.ganador); st.ganador = null; st.ang = 0; }
    const n = st.restantes.length; if (!n) return this.render();
    if (n === 1){ st.ganador = st.restantes[0]; st.orden.push(st.ganador); store.set('ix_ruleta_' + this.code, {orden: st.orden}); this.render(); confeti(160); return; }
    const k = Math.floor(Math.random() * n), seg = 2 * Math.PI / n;
    const destino = 2 * Math.PI * (5 + Math.floor(Math.random() * 3)) - (k + .5) * seg + (Math.random() - .5) * seg * .6;
    const ini = st.ang % (2 * Math.PI), t0 = performance.now(), dur = 4200;
    st.girando = true; this.render(); Musica.efecto('redoble');
    const paso = t => {
      const u = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - u, 4);
      st.ang = ini + (destino - ini) * e; this.dibujarRueda();
      if (u < 1) requestAnimationFrame(paso);
      else { st.girando = false; st.ganador = st.restantes[k]; st.orden.push(st.ganador); store.set('ix_ruleta_' + this.code, {orden: st.orden}); this.render(); confeti(160); Musica.efecto('campanas'); }
    };
    requestAnimationFrame(paso);
  },

  /* ---------- TRIVIA FAMILIAR ---------- */
  preguntas(){
    if (this.info.trivia.length) return this.info.trivia;
    return ADVIENTO.filter(a => a.t === 'trivia').map(a => ({pregunta: a.q, opciones: a.o, correcta: a.ok}));
  },
  vTrivia(){
    const st = this.st, qs = this.preguntas();
    if (st.fase === 'config') return `<div style="font-size:min(12vh,110px)">❓</div><div class="t2">Trivia familiar</div>
      <div class="t1">${this.info.trivia.length ? qs.length + ' preguntas escritas por el organizador' : 'Usaremos ' + qs.length + ' preguntas navideñas de ejemplo (escribe las tuyas en el panel)'}</div>
      <div class="tvbox" style="margin-top:2vh;max-width:800px">
        <div class="t1" style="margin-bottom:1vh">¿Cuántos equipos?</div>
        <div class="equipos" style="margin-top:0">${[2,3,4].map(n => `<button class="equipo ${st.n === n ? 'on' : ''}" data-neq="${n}">${n} equipos</button>`).join('')}</div>
        <div class="equipos">${st.nombres.slice(0, st.n).map((x, k) => `<input class="tvinput" style="width:min(40vw,260px)" data-eqn="${k}" value="${esc(x)}" maxlength="20">`).join('')}</div>
      </div>
      <div class="ctrl"><button class="btn oro" id="go">▶ Empezar</button></div>`;
    if (st.fase === 'fin'){
      const orden = st.equipos.map((e, k) => ({...e, k})).sort((a, b) => b.pts - a.pts);
      const empate = orden.length > 1 && orden[0].pts === orden[1].pts;
      return `<div style="font-size:min(14vh,130px)">🏆</div><div class="t2 oro">${empate ? '¡Empate!' : '¡Ganan ' + esc(orden[0].nombre) + '!'}</div>
        <div class="equipos">${orden.map(e => `<div class="equipo"><b>${e.pts}</b>${esc(e.nombre)}</div>`).join('')}</div>
        <div class="ctrl"><button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="go">↺ Jugar otra vez</button></div>`;
    }
    const q = qs[st.i], letras = ['A','B','C','D'];
    return `<div class="prog">Pregunta ${st.i + 1} de ${qs.length}</div>
      <div class="t2" style="font-size:clamp(28px,4.4vw,64px);max-width:92vw">${esc(q.pregunta)}</div>
      ${st.fase === 'pregunta' ? `<div class="timer"><i id="tbar" style="width:${st.t / 20 * 100}%"></i></div>` : ''}
      <div class="tvop">${q.opciones.map((o, k) => `<div class="${st.fase === 'respuesta' ? (k === q.correcta ? 'ok' : 'no') : ''}">${letras[k]}) ${esc(o)}</div>`).join('')}</div>
      ${st.fase === 'respuesta' ? `<div class="t1" style="margin-top:2vh">¿Quién acertó? Toca los equipos</div>` : ''}
      <div class="equipos">${st.equipos.map((e, k) => `<button class="equipo ${st.acerto && st.acerto[k] ? 'on' : ''}" data-eq="${k}" ${st.fase === 'respuesta' ? '' : 'disabled'}><b>${e.pts}</b>${esc(e.nombre)}</button>`).join('')}</div>
      <div class="ctrl"><button class="btn ${st.fase === 'pregunta' ? 'rojo' : 'oro'}" id="go">${st.fase === 'pregunta' ? `👀 Mostrar respuesta (${st.t})` : st.i + 1 < qs.length ? 'Siguiente ›' : 'Ver resultados 🏆'}</button></div>`;
  },
  enlazarTrivia(){
    const st = this.st, qs = this.preguntas();
    app.querySelectorAll('[data-neq]').forEach(b => b.onclick = () => { this.guardarNombres(); st.n = +b.dataset.neq; this.render(); });
    app.querySelectorAll('[data-eq]').forEach(b => b.onclick = () => { st.acerto[+b.dataset.eq] = !st.acerto[+b.dataset.eq]; this.render(); });
    const go = $('#go'); if (!go) return;
    go.onclick = () => {
      if (st.fase === 'config'){ this.guardarNombres(); st.equipos = st.nombres.slice(0, st.n).map(n => ({nombre: n || 'Equipo', pts: 0})); st.i = 0; this.preguntaNueva(); return; }
      if (st.fase === 'pregunta'){ this.mostrarRespuesta(); return; }
      if (st.fase === 'respuesta'){
        st.equipos.forEach((e, k) => { if (st.acerto[k]) e.pts++; });
        if (st.i + 1 < qs.length){ st.i++; this.preguntaNueva(); } else { st.fase = 'fin'; this.render(); confeti(260); Musica.efecto('campanas'); }
        return;
      }
      if (st.fase === 'fin'){ st.fase = 'config'; this.render(); }
    };
  },
  guardarNombres(){ app.querySelectorAll('[data-eqn]').forEach(i => this.st.nombres[+i.dataset.eqn] = i.value.trim()); },
  preguntaNueva(){
    const st = this.st; st.fase = 'pregunta'; st.t = 20; st.acerto = st.equipos.map(() => false);
    clearInterval(st.timer); this.render();
    st.timer = setInterval(() => {
      st.t--; const b = $('#tbar'), g = $('#go');
      if (b) b.style.width = (st.t / 20 * 100) + '%'; if (g) g.textContent = `👀 Mostrar respuesta (${st.t})`;
      if (st.t <= 0) this.mostrarRespuesta();
    }, 1000);
  },
  mostrarRespuesta(){ clearInterval(this.st.timer); this.st.fase = 'respuesta'; this.render(); Musica.efecto('campanas'); },

  /* ---------- MODO ROBADO ---------- */
  guardarRobado(){ store.set('ix_robado_' + this.code, this.st); },
  vRobado(){
    const st = this.st;
    if (st.fase === 'config'){
      const ruleta = store.get('ix_ruleta_' + this.code, null);
      const todos = this.info.personas.filter(p => p.asistencia !== 'no').map(p => p.nombre);
      const ro = ruleta && ruleta.orden ? ruleta.orden.filter(n => todos.includes(n)) : [];
      const usarRuleta = ro.length > 0;
      return `<div style="font-size:min(12vh,110px)">🔄</div><div class="t2">Modo robado</div>
        <div class="tvbox" style="margin-top:2vh;max-width:900px;text-align:left;font-size:clamp(15px,1.6vw,22px);line-height:1.5">
          <b>Reglas:</b> en su turno, cada quien <b>abre un regalo nuevo</b> o <b>roba uno ya abierto</b>. A quien le roban le toca de inmediato (no puede recuperar el mismo).
          Un regalo robado <b>${st.max} veces</b> queda congelado 🧊.
          <div class="equipos" style="justify-content:flex-start">${[1,2,3,4,5].map(n => `<button class="equipo ${st.max === n ? 'on' : ''}" data-max="${n}">Máx. ${n} robos</button>`).join('')}</div>
          <div style="margin-top:1.4vh;color:var(--sub)">Jugadores: ${todos.length} · ${usarRuleta ? (ro.length === todos.length ? 'en el orden de la ruleta' : 'primero el orden de la ruleta (' + ro.length + '), luego los demás al azar') : 'orden al azar (o gira primero la ruleta)'}</div>
        </div>
        <div class="ctrl"><button class="btn oro" id="go" ${todos.length < 2 ? 'disabled' : ''}>▶ Empezar</button></div>`;
    }
    const sinReg = st.jugadores.length - st.regalos.length;
    if (st.fase === 'fin') return `<div style="font-size:min(12vh,110px)">🎉</div><div class="t2 oro">¡Todos tienen regalo!</div>
      <div class="regalos">${st.regalos.map(r => `<div class="regalo"><b>🎁 ${esc(r.desc)}</b>${esc(r.dueno)} · robado ${r.robos}×</div>`).join('')}</div>
      <div class="ctrl"><button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="rbUndo">↶ Deshacer</button><button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="rbReset">↺ Nuevo juego</button></div>`;
    const robables = st.regalos.map((r, k) => ({r, k})).filter(({r, k}) => r.dueno !== st.turno && r.robos < st.max && k !== st.bloqueado);
    return `<div class="prog">🎁 ${sinReg} por abrir</div>
      <div class="t1">Turno de</div><div class="t3" style="font-size:clamp(44px,7vw,100px)">${esc(st.turno)}</div>
      ${st.aviso ? `<div class="t1" style="color:var(--oro2)">${esc(st.aviso)}</div>` : ''}
      ${st.fase === 'abrir' ? `<div class="tvbox" style="margin-top:2vh;max-width:800px"><div class="t1" style="margin-bottom:1vh">¿Qué le salió? (opcional)</div>
          <input class="tvinput" id="rbDesc" maxlength="40" placeholder="Ej. Bufanda roja"></div>
        <div class="ctrl"><button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="rbCancel">Cancelar</button><button class="btn oro" id="go">🎁 Listo</button></div>`
      : `${st.regalos.length ? `<div class="t1" style="margin-top:1vh">${robables.length ? 'Toca un regalo para robarlo, o abre uno nuevo' : 'No hay regalos para robar: abre uno nuevo'}</div>` : ''}
        <div class="regalos">${st.regalos.map((r, k) => { const ok = robables.some(x => x.k === k);
          return `<button class="regalo ${r.robos >= st.max ? 'frio' : ''}" data-robar="${k}" ${ok ? '' : 'disabled'}><b>🎁 ${esc(r.desc)}</b>${esc(r.dueno)}<br>${r.robos >= st.max ? '🧊 Congelado' : '🔄'.repeat(r.robos) + (r.robos ? '' : 'Sin robos')}</button>`; }).join('')}</div>
        <div class="ctrl"><button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="rbUndo" ${st.hist && st.hist.length ? '' : 'disabled'}>↶ Deshacer</button><button class="btn oro" id="go">🎁 Abrir regalo nuevo</button></div>`}`;
  },
  enlazarRobado(){
    const st = this.st;
    app.querySelectorAll('[data-max]').forEach(b => b.onclick = () => { st.max = +b.dataset.max; this.render(); });
    const snap = () => { const c = JSON.parse(JSON.stringify(st)); delete c.hist; (st.hist = st.hist || []).push(c); if (st.hist.length > 40) st.hist.shift(); };
    const go = $('#go');
    if (go) go.onclick = () => {
      if (st.fase === 'config'){
        const ruleta = store.get('ix_ruleta_' + this.code, null);
        const todos = this.info.personas.filter(p => p.asistencia !== 'no').map(p => p.nombre);
        const ro = ruleta && ruleta.orden ? ruleta.orden.filter(n => todos.includes(n)) : [];
        const jug = [...ro, ...todos.filter(n => !ro.includes(n)).sort(() => Math.random() - .5)];
        Object.assign(st, {fase: 'turno', jugadores: jug, cola: 0, turno: jug[0], regalos: [], bloqueado: null, aviso: '', hist: []});
      } else if (st.fase === 'turno'){ st.fase = 'abrir'; }
      else if (st.fase === 'abrir'){
        snap();
        const d = ($('#rbDesc') || {}).value; st.regalos.push({desc: (d || '').trim() || 'Regalo #' + (st.regalos.length + 1), dueno: st.turno, robos: 0});
        confeti(80); Musica.efecto('campanas');
        st.cola++; st.bloqueado = null; st.aviso = '';
        if (st.regalos.length >= st.jugadores.length) st.fase = 'fin';
        else { while (st.regalos.some(r => r.dueno === st.jugadores[st.cola])) st.cola++; st.turno = st.jugadores[st.cola]; st.fase = 'turno'; }
      }
      this.guardarRobado(); this.render();
      if (st.fase === 'abrir'){ const i = $('#rbDesc'); if (i){ i.focus(); i.onkeydown = e => { if (e.key === 'Enter') $('#go').click(); }; } }
    };
    app.querySelectorAll('[data-robar]').forEach(b => b.onclick = () => {
      snap();
      const k = +b.dataset.robar, r = st.regalos[k], victima = r.dueno;
      r.dueno = st.turno; r.robos++;
      st.aviso = `${st.turno} le robó «${r.desc}» a ${victima}${r.robos >= st.max ? ' 🧊 ¡y quedó congelado!' : ''}`;
      st.turno = victima; st.bloqueado = k;
      Musica.efecto('redoble'); this.guardarRobado(); this.render();
    });
    const u = $('#rbUndo'); if (u) u.onclick = () => { const h = st.hist || []; if (!h.length) return; const prev = h.pop(); prev.hist = h; this.st = prev; this.guardarRobado(); this.render(); };
    const rs = $('#rbReset'); if (rs) rs.onclick = () => { store.del('ix_robado_' + this.code); this.ir('robado'); };
    const ca = $('#rbCancel'); if (ca) ca.onclick = () => { st.fase = 'turno'; this.render(); };
  },

  /* ---------- ÁLBUM ---------- */
  vAlbum(){
    const fs = this.st.fotos;
    if (!fs.length) return `<div style="font-size:min(14vh,130px)">📸</div><div class="t2">Aún no hay fotos</div>
      <div class="t1">Pídele a todos que suban fotos desde su app, en la pestaña Evento → Álbum.</div>`;
    const f = fs[this.st.i];
    return `<div class="prog">${this.st.i + 1} de ${fs.length}</div>

      const st = r.querySelector('#auStop'); if (st) st.onclick = () => { clearInterval(timer); rec.stop(); };
      r.querySelectorAll('[data-ef]').forEach(b => b.onclick = () => { efecto = b.dataset.ef; listo = null; pintar(); });
      const pv = r.querySelector('#auPrev'); if (pv) pv.onclick = () => hacer(pv, async () => { listo = listo || await Audio8.procesar(blob, efecto); await new Audio(listo).play(); });

             : a.o.map((o, i) => `<button class="btn ghost opcion" data-op="${i}">${esc(o)}</button>`).join('')}`;
    } else cuerpo = `<p style="font-size:17px;line-height:1.45">${texto}</p>${a.ir ? `<button class="btn verde full" data-irr="${a.ir}">¡Vamos!</button>` : ''}`;

      r.querySelectorAll('[data-op]').forEach(x => { x.disabled = true; if (+x.dataset.op === a.ok) x.className = 'btn verde opcion'; else if (x === b) x.className = 'btn rojo opcion'; });

      await rpc('ix_adviento', Object.assign({p_token: this.token, p_pin: this.pin}, {p_dia: d, p_correcta: ok}));
      try{ this.d = await rpc('ix_entrar', {p_token: this.token, p_pin: this.pin}); }catch(e){}
    }));
    if (a.fin) confeti(220);

  enlazar(){
    const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
    const base = () => ({p_token: this.token, p_pin: this.pin});
    app.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { this.tab = b.dataset.ir; if (b.dataset.con) this.chatCon = b.dataset.con; this.render(); window.scrollTo(0,0); });
    app.querySelectorAll('.seg [data-con]').forEach(b => b.onclick = () => { this.chatCon = b.dataset.con; this.render(); });
    app.querySelectorAll('img[data-foto]').forEach(i => i.onclick = () => verFoto(i.src));
    on('#gift', e => {
      const gft = e.currentTarget; gft.classList.add('shake'); Musica.efecto('redoble');
      setTimeout(() => { gft.classList.remove('shake'); gft.classList.add('open'); }, 1000);
      setTimeout(() => { store.set('ix_rev_' + this.token, this.d.amigo.nombre); this.render(); confeti(); Musica.efecto('campanas'); }, 1600);
    });
    app.querySelectorAll('[data-comprar]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_deseo_comprado', Object.assign(base(), {p_id: b.dataset.comprar, p_comprado: b.dataset.v === '1'}));
      await this.refrescar();
    }));
    app.querySelectorAll('[data-prio]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_deseo_prioridad', Object.assign(base(), {p_id: b.dataset.prio, p_prioridad: +b.dataset.v}));
      await this.refrescar();
    }));
    const fi = $('#d_foto'); if (fi) fi.onchange = async () => {
      try{ this.foto = await reducirFoto(fi.files[0]); this.render(true); }catch(e){ toast(e.message, true); }
    };
    on('#d_fotoq', () => { this.foto = null; this.render(true); });
    on('#d_prio', () => { this.prio = this.prio === 1 ? 2 : 1; this.render(true); });
    on('#d_grupal', () => { this.grupal = !this.grupal; this.render(true); if (this.grupal) toast('🤝 Los demás podrán cooperar para este regalo (tú no verás quién)'); });
    app.querySelectorAll('[data-grupal]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_deseo_grupal', Object.assign(base(), {p_id: b.dataset.grupal, p_grupal: b.dataset.v === '1'})); await this.refrescar();
    }));
    const avf = $('#av_foto'); if (avf) avf.onchange = () => hacer(null, async () => {
      const f = await reducirAvatar(avf.files[0]); await rpc('ix_avatar', Object.assign(base(), {p_foto: f})); toast('📸 ¡Foto lista!'); await this.refrescar();
    });
    on('#av_q', e => hacer(e.currentTarget, async () => { await rpc('ix_avatar', Object.assign(base(), {p_foto: null})); await this.refrescar(); }));
    on('#d_add', e => hacer(e.currentTarget, async () => {
      const t = $('#d_txt').value.trim(); if (!t) throw new Error('Escribe qué te gustaría');
      let link = $('#d_link').value.trim(); if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
      const pr = $('#d_precio').value;
      await rpc('ix_deseo_agregar', Object.assign(base(), {p_texto: t, p_link: link || null, p_precio: pr === '' ? null : Number(pr), p_foto: this.foto, p_prioridad: this.prio, p_grupal: !!this.grupal}));
      this.foto = null; this.prio = 2; this.grupal = false;
      ['d_txt','d_link','d_precio'].forEach(id => { const el = $('#' + id); el.value = ''; el.dataset.keep = 'no'; });
      toast('¡Agregado a tu lista! 🎁'); await this.refrescar(); const n = $('#d_txt'); if (n) n.focus();
    }));
    const dp = $('#d_precio'), da = $('#d_alerta'), monto = +this.d.grupo.monto || 0;
    if (dp && da){ const f = () => { da.textContent = monto && +dp.value > monto ? `⚠️ Cuesta más que el monto (${money(monto)}). Tu Santa podría buscar algo parecido.` : ''; }; dp.oninput = f; f(); }
    const dt = $('#d_txt'); if (dt) dt.onkeydown = e => { if (e.key === 'Enter') $('#d_add').click(); };
    app.querySelectorAll('[data-idea]').forEach(b => b.onclick = () => hacer(b, async () => {
      const [e, t, pr] = (this.ideasLista || [])[+b.dataset.idea] || [];
      if (!t) return;
      await rpc('ix_deseo_agregar', Object.assign(base(), {p_texto: t, p_link: null, p_precio: pr, p_foto: null, p_prioridad: 2, p_grupal: false}));
      toast('¡Agregado! ' + e); await this.refrescar();
    }));
    on('#sorprende', e => hacer(e.currentTarget, async () => {
      const ya = this.d.mis_deseos.map(d => norm(d.texto));
      const pick = ideasPara(this.d.yo.perfil, this.d.grupo.monto, 30).filter(i => !ya.includes(norm(i[1]))).slice(0, 3);
      if (!pick.length) throw new Error('Ya no tengo más ideas para ti 😅');
      for (const [e, t, pr] of pick) await rpc('ix_deseo_agregar', Object.assign(base(), {p_texto: t, p_link: null, p_precio: pr, p_foto: null, p_prioridad: 2, p_grupal: false}));
      toast('🎲 Agregué: ' + pick.map(i => i[0]).join(' ')); confeti(60); await this.refrescar();
    }));
    app.querySelectorAll('[data-borrard]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_deseo_quitar', Object.assign(base(), {p_id: b.dataset.borrard})); await this.refrescar();
    }));
    on('#pf_save', e => hacer(e.currentTarget, async () => {
      const pf = {}; ['talla','calzado','colores','gustos','evitar','yatengo'].forEach(k => pf[k] = $('#pf_' + k).value.trim());
      await rpc('ix_perfil', Object.assign(base(), {p_perfil: pf})); toast('Datos guardados ✅'); await this.refrescar();
    }));
    const rf = $('#rfSubir'); if (rf) rf.onchange = () => hacer(null, async () => {
      const f = await reducirFoto(rf.files[0]); await rpc('ix_regalo_foto', Object.assign(base(), {p_foto: f}));
      toast('📸 Foto guardada en secreto'); await this.refrescar();
    });
    on('#rfQuitar', e => hacer(e.currentTarget, async () => { await rpc('ix_regalo_foto', Object.assign(base(), {p_foto: null})); await this.refrescar(); }));
    on('#pistasSave', e => hacer(e.currentTarget, async () => {
      for (const n of [1,2,3]){
        const nuevo = $('#pista' + n).value.trim(), viejo = ((this.d.pistas_mias || []).find(x => x.n === n) || {}).texto || '';
        if (nuevo !== viejo) await rpc('ix_pista_guardar', Object.assign(base(), {p_n: n, p_texto: nuevo}));
      }
      toast('Pistas guardadas 🕵️'); await this.refrescar();
    }));
    const send = btn => hacer(btn, async () => {
      const t = $('#m_txt').value.trim(); if (!t) return;
      await rpc('ix_mensaje', Object.assign(base(), {p_hacia: this.chatCon, p_texto: t}));
      Push.avisar({tipo: 'mensaje', token: this.token, pin: this.pin, hacia: this.chatCon});
      $('#m_txt').value = ''; $('#m_txt').dataset.keep = 'no';
      await this.refrescar(); const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight;
    });
    on('#m_send', e => send(e.currentTarget));
    on('#m_mic', () => this.grabar());
    app.querySelectorAll('[data-audio]').forEach(b => b.onclick = () => hacer(b, async () => {
      const r = await rpc('ix_audio', Object.assign(base(), {p_id: b.dataset.audio}));
      if (!r || !r.audio) throw new Error('No se encontró el audio');
      const au = new Audio(r.audio); b.textContent = '🔊 …'; au.onended = () => { b.textContent = '▶️ Mensaje de voz'; }; await au.play();
    }));
    const pc = $('#pushCard'); if (pc && !store.get('ix_push_no', false)) Push.activo().then(on => { if (!on) pc.hidden = false; });
    on('#pushAct', () => this.activarPush());
    const adv = $('#adivina'); if (adv) adv.onchange = () => hacer(null, async () => {
      await rpc('ix_adivinar', Object.assign(base(), {p_id: adv.value || null}));
      toast(adv.value ? '🕵️ Voto guardado' : 'Voto borrado'); await this.refrescar();
    });
    const mt = $('#m_txt'); if (mt) mt.onkeydown = e => { if (e.key === 'Enter') send($('#m_send')); };
    const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight;
    app.querySelectorAll('[data-cena]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_cena_tomar', Object.assign(base(), {p_id: b.dataset.cena, p_tomar: b.dataset.v === '1'}));
      toast(b.dataset.v === '1' ? '¡Apartado! 🍽️' : 'Listo, lo soltaste'); await this.refrescar();
    }));
    on('#cenaAdd', e => hacer(e.currentTarget, async () => {
      const t = $('#cena_txt').value.trim(); if (!t) throw new Error('Escribe qué vas a llevar');
      await rpc('ix_cena_agregar', Object.assign(base(), {p_texto: t}));
      $('#cena_txt').value = ''; $('#cena_txt').dataset.keep = 'no'; toast('¡Anotado! 🍽️'); await this.refrescar();
    }));
    on('#salir', () => { store.del('ix_pin_' + this.token); location.reload(); });
    on('#instalarP', () => instalar());
    app.querySelectorAll('[data-dia]').forEach(b => b.onclick = () => this.abrirDia(+b.dataset.dia));
    if (this.tab === 'evento' && !this.album && !this._cargandoAlbum) this.cargarAlbum();
    const af = $('#al_foto'); if (af) af.onchange = () => hacer(null, async () => {
      const f = await reducirFoto(af.files[0]);
      await rpc('ix_foto_subir', Object.assign(base(), {p_foto: f, p_texto: $('#al_txt').value.trim() || null}));
      $('#al_txt').value = ''; $('#al_txt').dataset.keep = 'no'; toast('📸 ¡Foto en el álbum!'); this.album = null; await this.cargarAlbum();
    });
    app.querySelectorAll('[data-aporte]').forEach(b => b.onclick = () => hacer(b, async () => {
      const v = Number($('#ap_' + b.dataset.aporte).value); if (!v) throw new Error('Escribe con cuánto cooperas');
      await rpc('ix_aporte', Object.assign(base(), {p_deseo: b.dataset.aporte, p_monto: v})); toast('🤝 ¡Gracias por cooperar!'); await this.refrescar();
    }));
    app.querySelectorAll('[data-aportex]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_aporte', Object.assign(base(), {p_deseo: b.dataset.aportex, p_monto: 0})); await this.refrescar();
    }));
    app.querySelectorAll('[data-alq]').forEach(b => b.onclick = () => hacer(b, async () => {
      await rpc('ix_foto_borrar', Object.assign(base(), {p_id: b.dataset.alq})); this.album = null; await this.cargarAlbum();
    }));
    app.querySelectorAll('[data-asis]').forEach(b => b.onclick = () => hacer(b, async () => {
      const v = b.dataset.asis === this.d.yo.asistencia ? null : b.dataset.asis;
      await rpc('ix_asistencia', Object.assign(base(), {p_valor: v}));
      toast(v === 'si' ? '¡Qué bien! Nos vemos ahí 🎉' : v === 'no' ? 'Le avisamos al organizador' : v ? 'Anotado 🤔' : 'Respuesta borrada');
      await this.refrescar();
    }));
    on('#cambiarPin', () => {
      const r = modal(`<h2>🔐 Cambiar mi código</h2><p class="muted mt0">Elige 4 números fáciles de recordar para ti${this.token !== this.raiz ? ' (es el código de ' + esc(this.d.yo.nombre) + ')' : ''}. El organizador ya no lo verá.</p>
        <label>Código nuevo</label><input id="np1" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:8px;font-size:22px;text-align:center">
        <label>Repítelo</label><input id="np2" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:8px;font-size:22px;text-align:center">
        <div class="row mt"><button class="btn ghost grow" data-x="no">Cancelar</button><button class="btn rojo grow" data-x="si">Guardar</button></div>`);
      r.querySelector('[data-x=no]').onclick = closeModal;
      r.querySelector('[data-x=si]').onclick = e => hacer(e.currentTarget, async () => {
        const a = $('#np1').value.trim(), b2 = $('#np2').value.trim();
        if (!/^\d{4}$/.test(a)) throw new Error('Deben ser 4 números');
        if (a !== b2) throw new Error('Los códigos no coinciden');
        await rpc('ix_cambiar_pin', Object.assign(base(), {p_nuevo: a}));
        this.pin = a; store.set('ix_pin_' + this.token, a);
        const f = this.familia.find(x => x.token === this.token); if (f) f.pin = a;
        closeModal(); toast('Código cambiado 🔐 Guárdalo bien'); await this.refrescar();
      });
    });
  }
};

arrancar();
</script>
</body>
</html>
